services:
  sensing-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rust
    image: ruvnet/wifi-densepose:latest
    ports:
      - "${HTTP_PORT:-4000}:3000"   # REST API + UI
      - "${WS_PORT:-4001}:3001"     # WebSocket
      - "${UDP_PORT:-5005}:5005/udp"  # ESP32 UDP
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - CSI_SOURCE=${CSI_SOURCE:-simulated}
      - RUVIEW_API_TOKEN=${RUVIEW_API_TOKEN:-dev-token-please-change}
      - MODELS_DIR=${MODELS_DIR:-data/models}
      - LOG_FORMAT=${LOG_FORMAT:-text}
    volumes:
      - models-data:/app/models
      - recordings-data:/app/recordings
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    depends_on: []

  python-sensing:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    image: ruvnet/wifi-densepose:python
    ports:
      - "${PYTHON_WS_PORT:-5000}:8765"   # WebSocket
      - "${PYTHON_UI_PORT:-5001}:8080"   # UI
    environment:
      - PYTHONUNBUFFERED=1
      - CSI_SOURCE=simulated
    restart: unless-stopped

volumes:
  models-data:
  recordings-data:

