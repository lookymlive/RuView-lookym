services:
  sensing-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rust
    image: ruvnet/wifi-densepose:latest
    ports:
      - "4000:3000"   # REST API
      - "4001:3001"   # WebSocket
      - "5005:5005/udp"  # ESP32 UDP
    environment:
      - RUST_LOG=info
      - CSI_SOURCE=${CSI_SOURCE:-simulated}
      - RUVIEW_API_TOKEN=${RUVIEW_API_TOKEN:-dev-token-please-change}
      - MODELS_DIR=${MODELS_DIR:-data/models}
    # No explicit command needed (2026-08-12 review) — docker-entrypoint.sh uses CSI_SOURCE.
    # Override with: command: ["--source", "esp32", "--tick-ms", "500"]

  python-sensing:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    image: ruvnet/wifi-densepose:python
    ports:
      - "5000:8765"   # WebSocket
      - "5001:8080"   # UI
    environment:
      - PYTHONUNBUFFERED=1
      - CSI_SOURCE=simulated


